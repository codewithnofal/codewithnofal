name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: codewithnofal
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula

      - name: Move trophy to output folder
        run: |
          mkdir -p trophy-output
          mv trophy.svg trophy-output/trophy.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy-output/trophy.svg

          git diff --staged --quiet || git commit -m "Update GitHub trophy"

          git push
